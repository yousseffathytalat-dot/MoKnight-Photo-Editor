name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="MoKnight-PhotoEditor-Model-Downloads.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "ZIP files found:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          if [ ! -f "extracted-project/PhotoEditor/settings.gradle.kts" ]; then
            echo "ERROR: Expected project folder extracted-project/PhotoEditor was not found."
            find extracted-project -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: extracted-project/PhotoEditor
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Prints only the real compile errors (lines starting with "e:") in a short, readable list.
      - name: Show compile errors
        if: failure()
        working-directory: extracted-project/PhotoEditor
        shell: bash
        run: |
          echo "===== COMPILE ERRORS ====="
          grep -E '^e: ' build.log | sed -E 's#file:///[^ ]*/photoeditor/##' | sort -u | head -150 || true
          echo "===== GRADLE FAILURE ====="
          grep -A6 'What went wrong' build.log | head -30 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: extracted-project/PhotoEditor/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoKnight-PhotoEditor-debug
          path: extracted-project/PhotoEditor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
